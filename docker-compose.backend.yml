services:
  db:
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-common_trails}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata_backend:/var/lib/postgresql/data
    ports:
      - "5487:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-common_trails}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TEST_MODE: ${TEST_MODE:-false}
      ENABLE_STRAVA_INTEGRATION: ${ENABLE_STRAVA_INTEGRATION:-false}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:8787/integrations/strava/callback}
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-false}
      SKIP_DEM_ENRICHMENT: ${SKIP_DEM_ENRICHMENT:-true}
      HEATMAP_K_ANONYMITY: ${HEATMAP_K_ANONYMITY:-1}
      CI: ${CI:-}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Repo scripts, read-only — lets the deploy-contract test
      # (tests/test_deploy_split_contract.py) read scripts/deploy-prod.sh,
      # which lives OUTSIDE the ./backend build context. Mounted at /scripts
      # (a parent of /app/tests) so the test's walk-up path resolution finds
      # it. RO so the test container can never mutate the deploy SSOT.
      - ./scripts:/scripts:ro

volumes:
  pgdata_backend:
