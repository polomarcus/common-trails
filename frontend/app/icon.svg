<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a4731"/>
  <!-- Snow cap -->
  <polygon points="16,4 20,12 12,12" fill="#f8faf8"/>
  <!-- Main mountain -->
  <polygon points="16,4 28,26 4,26" fill="#2d6a4f"/>
  <!-- Secondary peak (left) -->
  <polygon points="8,14 16,26 1,26" fill="#1a4731" opacity="0.7"/>
  <!-- Route line hint (red accent) -->
