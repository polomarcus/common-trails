<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f1a"/>
      <stop offset="100%" stop-color="#1a4731"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0e8ff"/>
      <stop offset="25%" stop-color="#7bb3f0"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative trail lines -->
  <path d="M0 420 Q200 380 400 400 T800 360 T1200 390" fill="none" stroke="url(#heat)" stroke-width="4" opacity="0.3"/>
  <path d="M0 460 Q300 420 500 450 T900 410 T1200 440" fill="none" stroke="url(#heat)" stroke-width="3" opacity="0.2"/>
  <path d="M0 500 Q250 470 450 490 T850 460 T1200 480" fill="none" stroke="url(#heat)" stroke-width="2" opacity="0.15"/>
  <!-- Sport color dots -->
  <circle cx="340" cy="540" r="6" fill="#2563eb" opacity="0.6"/>
  <circle cx="440" cy="530" r="6" fill="#d97706" opacity="0.6"/>
  <circle cx="540" cy="545" r="6" fill="#7c3aed" opacity="0.6"/>
  <circle cx="640" cy="535" r="6" fill="#0891b2" opacity="0.6"/>
  <circle cx="740" cy="540" r="6" fill="#dc2626" opacity="0.6"/>
  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">CHEMINS COMMUNS</text>
  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a7c4a0" letter-spacing="4">COMMON TRAILS</text>
  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#d1d5db">Route · Gravel · VTT · Off-road · Course</text>
  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#heat)" opacity="0.6"/>
</svg>
