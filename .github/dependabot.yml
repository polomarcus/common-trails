# Automated dependency updates.
#
# Two opposite risks, one policy:
# - known vulnerabilities are now weaponised within hours (AI-assisted exploit
#   writing): Dependabot SECURITY updates (repo setting) open a PR as soon as an
#   advisory hits one of our locked versions — not delayed by the cooldown;
# - a hijacked maintainer account / self-spreading worm publishes a poisoned
#   release that registries usually pull within days: routine VERSION updates
#   wait a cooldown first, so we never adopt a release the day it ships.
# Every update arrives as a PR through the full CI; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      backend-minor-patch: { update-types: ["minor", "patch"] }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      frontend-minor-patch: { update-types: ["minor", "patch"] }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    cooldown: { default-days: 7, semver-major-days: 30 }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps)" }

  # Actions are pinned to commit SHAs (a moved tag cannot swap their code);
  # Dependabot bumps the SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
